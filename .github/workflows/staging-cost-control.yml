name: Staging Cost Control

run-name: Staging cost control · ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect, pause, or resume staging
        type: choice
        required: true
        default: status
        options: [status, pause, resume]
      confirm:
        description: Confirm a pause or resume operation
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: rentstage-staging-change
  cancel-in-progress: false

jobs:
  control:
    name: ${{ inputs.operation }} staging services
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      STAGING_DEPLOY_ENABLED: ${{ vars.STAGING_DEPLOY_ENABLED }}
      CONFIRM_STAGING_COST_OPERATION: ${{ inputs.confirm }}
    steps:
      - name: Require main branch and a deliberate request
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo 'Run staging cost controls only from main.' >&2
            exit 1
          fi
          if [[ "$OPERATION" != "status" && "$CONFIRM_STAGING_COST_OPERATION" != "true" ]]; then
            echo 'Pause and resume require confirm=true.' >&2
            exit 1
          fi
          if [[ "$OPERATION" == "pause" && "$STAGING_DEPLOY_ENABLED" != "false" ]]; then
            echo 'Set repository variable STAGING_DEPLOY_ENABLED=false before pausing staging.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - name: ${{ inputs.operation }} staging
        run: bash scripts/gcp/staging-cost-control.sh "${{ inputs.operation }}"
