name: Production Infrastructure Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: rentstage-production-infrastructure
  cancel-in-progress: false

jobs:
  terraform-plan:
    name: Terraform production plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: production
    defaults:
      run:
        working-directory: infra/production
    env:
      TF_IN_AUTOMATION: 'true'
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_artifact_repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      TF_VAR_deploy_service_account_email: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      TF_VAR_database_password: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Run the production infrastructure plan only from main.' >&2
          exit 1
      - uses: actions/checkout@v7.0.1
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_INFRA_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive ..
      - name: Initialize isolated production state
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" -backend-config="prefix=rentstage/production"
      - name: Validate configuration
        run: terraform validate
      - name: Create review-only plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan
      - name: Production plan summary
        run: |
          {
            echo '## RentStage production infrastructure plan'
            echo ''
            echo '- Environment: protected `production`'
            echo '- State prefix: `rentstage/production`'
            echo '- Project: `${{ vars.GCP_PROJECT_ID }}`'
            echo '- Region: `${{ vars.GCP_REGION }}`'
            echo '- Apply: **not available in this workflow**'
            echo '- Meta credentials: secret containers only; no values are managed by Terraform'
            echo ''
            echo 'Review the full plan log and the Cloud SQL estimate before a later apply increment.'
          } >> "$GITHUB_STEP_SUMMARY"
