version: 2

updates:
  - package-ecosystem: gomod
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /apps/web
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
